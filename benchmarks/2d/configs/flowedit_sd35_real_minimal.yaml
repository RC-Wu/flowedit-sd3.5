experiment:
  name: flowedit_sd35_real_minimal
  mode: real_2d_minimal
  benchmark: 2d

model:
  family: sd3.5
  key: sd35-medium-turbo-open
  model_id: ""
  hf_home: /dev_vepfs/rc_wu/cache/hf_home_dev02
  adapter_resize_side: 512
  adapter_gpu: 0

pipeline:
  edit_method: flowedit
  steps: 24
  n_avg: 1
  src_guidance_scale: 2.5
  tar_guidance_scale: 9.0
  n_min: 0
  n_max: 14

dnaedit:
  steps: 40
  src_guidance_scale: 1.0
  tar_guidance_scale: 3.5
  t_start: 13
  mvg: 0.8
  runtime_root: ""

runtime:
  device: cuda
  mixed_precision: fp16

validation:
  smoke:
    record_vram_usage: true
    required_metrics:
      - peak_vram_mb
      - allocated_vram_mb
      - reserved_vram_mb
