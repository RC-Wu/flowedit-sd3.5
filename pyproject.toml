[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowedit-sd3.5"
version = "0.1.0"
description = "Standalone skeleton for SD3.5 FlowEdit + DNAEdit benchmarks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
flowedit-sd35-runner = "flowedit_sd35.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
